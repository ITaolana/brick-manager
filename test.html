<!DOCTYPE html>
<html>
<head><title>BrickManager Tests</title>
<style>body{font-family:sans-serif;padding:20px;max-width:600px;margin:0 auto}.pass{color:green}.fail{color:red}li{padding:8px;border-bottom:1px solid #eee}</style>
</head>
<body>
<h1>BrickManager Tests</h1>
<button onclick="runTests()" style="padding:10px 20px;margin:10px 0;">Run Tests</button>
<div id="results"></div>
<script src="js/db.js"></script>
<script>
const results = [];
function test(name,fn){try{fn();results.push({name,passed:true})}catch(e){results.push({name,passed:false,error:e.message})}}
function assertEqual(a,e,msg){if(a!==e)throw new Error(msg||'Expected '+e+', got '+a)}
function assertTrue(v,msg){if(!v)throw new Error(msg||'Expected true')}

async function runTests(){
results.length=0;document.getElementById('results').innerHTML='Running...';
await initDB();

test('Database initialized',()=>{assertTrue(db!==null)});

let wid;test('Add worker',async()=>{wid=await addWorker({name:'John',role:'Mason'});assertTrue(wid>0)});
test('Get worker',async()=>{const w=await getWorker(wid);assertEqual(w.name,'John')});
test('Update worker',async()=>{await updateWorker({id:wid,name:'John',role:'Foreman'});const w=await getWorker(wid);assertEqual(w.role,'Foreman')});

let cid;test('Add cash received',async()=>{cid=await addCustomer({name:'Test',amount:500,date:'2026-08-07'});assertTrue(cid>0)});
test('Get customers',async()=>{const c=await getCustomers();assertTrue(c.length>0)});

let eid;test('Add expense',async()=>{eid=await addExpense({description:'Test',amount:100,date:'2026-08-07'});assertTrue(eid>0)});
test('Get expenses',async()=>{const e=await getExpenses();assertTrue(e.length>0)});

test('Settings',async()=>{await setSetting('test','val');const v=await getSetting('test');assertEqual(v,'val')});

test('Delete worker',async()=>{await deleteWorker(wid);const w=await getWorker(wid);assertTrue(w===undefined)});

const passed=results.filter(r=>r.passed).length;
document.getElementById('results').innerHTML=`<h2>Results: ${passed}/${results.length} passed</h2><ul style="list-style:none;padding:0;">${results.map(r=>`<li class="${r.passed?'pass':'fail'}">${r.passed?'✓':'✗'} ${r.name}${!r.passed?'<br><small>'+r.error+'</small>':''}</li>`).join('')}</ul>`;
}
window.onload=runTests;
</script>
</body>
</html>
