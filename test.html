<!DOCTYPE html>
<html>
<head>
    <title>BrickManager - Tests</title>
</head>
<body>
    <h1>BrickManager Unit Tests</h1>
    <div id="results"></div>
    
    <script src="js/db.js"></script>
    <script>
        const results = [];
        
        function test(name, fn) {
            try {
                fn();
                results.push({ name, passed: true });
                console.log('✓ ' + name);
            } catch (e) {
                results.push({ name, passed: false, error: e.message });
                console.log('✗ ' + name + ': ' + e.message);
            }
        }
        
        function assertEqual(actual, expected, msg) {
            if (actual !== expected) {
                throw new Error(msg || `Expected ${expected}, got ${actual}`);
            }
        }
        
        function assertTrue(val, msg) {
            if (!val) throw new Error(msg || 'Expected true');
        }
        
        async function runTests() {
            const output = document.getElementById('results');
            
            output.innerHTML = 'Running tests...';
            
            await initDB();
            
            // Test 1: Add worker
            test('Add worker to database', async () => {
                const id = await addWorker({ name: 'John Doe', role: 'Mason' });
                assertTrue(id > 0, 'Should return valid ID');
                const worker = await getWorker(id);
                assertEqual(worker.name, 'John Doe');
                assertEqual(worker.role, 'Mason');
            });
            
            // Test 2: Get all workers
            test('Get all workers', async () => {
                const workers = await getWorkers();
                assertTrue(workers.length > 0, 'Should have at least one worker');
            });
            
            // Test 3: Update worker
            test('Update worker', async () => {
                const workers = await getWorkers();
                const worker = workers[0];
                await updateWorker({ ...worker, role: 'Foreman' });
                const updated = await getWorker(worker.id);
                assertEqual(updated.role, 'Foreman');
            });
            
            // Test 4: Delete worker
            test('Delete worker', async () => {
                const workers = await getWorkers();
                const worker = workers[workers.length - 1];
                await deleteWorker(worker.id);
                const deleted = await getWorker(worker.id);
                assertTrue(deleted === undefined, 'Worker should be deleted');
            });
            
            // Test 5: Add customer
            test('Add customer with delivery', async () => {
                const id = await addCustomer({
                    name: 'Test Customer',
                    product_type: 'Bricks',
                    payment_date: '2026-08-15',
                    amount: 5000,
                    needs_delivery: 1,
                    delivery_address: '123 Main St',
                    delivery_status: 'pending'
                });
                assertTrue(id > 0);
                const customer = await getCustomer(id);
                assertEqual(customer.needs_delivery, 1);
                assertEqual(customer.delivery_status, 'pending');
            });
            
            // Test 6: Toggle delivery status
            test('Toggle delivery status', async () => {
                const customers = await getCustomers();
                const customer = customers[0];
                await updateCustomer({ ...customer, delivery_status: 'delivered' });
                const updated = await getCustomer(customer.id);
                assertEqual(updated.delivery_status, 'delivered');
            });
            
            // Test 7: Add expense
            test('Add expense', async () => {
                const id = await addExpense({
                    description: 'Test Expense',
                    amount: 100,
                    date: '2026-08-07'
                });
                assertTrue(id > 0);
            });
            
            // Test 8: Get expenses total
            test('Calculate expenses total', async () => {
                const expenses = await getExpenses();
                const total = expenses.reduce((sum, e) => sum + Number(e.amount), 0);
                assertTrue(total > 0, 'Should have expenses');
            });
            
            // Test 9: Settings
            test('Save and retrieve setting', async () => {
                await setSetting('test_key', 'test_value');
                const value = await getSetting('test_key');
                assertEqual(value, 'test_value');
            });
            
            // Test 10: Export data
            test('Export all data', async () => {
                const data = await exportAllData();
                assertTrue(data.workers !== undefined);
                assertTrue(data.customers !== undefined);
                assertTrue(data.expenses !== undefined);
            });
            
            // Display results
            const passed = results.filter(r => r.passed).length;
            const failed = results.filter(r => !r.passed).length;
            
            output.innerHTML = `
                <h2>Test Results</h2>
                <p>Passed: ${passed} | Failed: ${failed}</p>
                <ul style="list-style:none;padding:0;">
                    ${results.map(r => `
                        <li style="padding:8px;border-bottom:1px solid #eee;color:${r.passed ? 'green' : 'red'}">
                            ${r.passed ? '✓' : '✗'} ${r.name}
                            ${!r.passed ? `<br><small>${r.error}</small>` : ''}
                        </li>
                    `).join('')}
                </ul>
            `;
            
            console.log(`\n=== Results: ${passed} passed, ${failed} failed ===`);
        }
        
        runTests();
    </script>
</body>
</html>
